[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
script = "script"
solc_version = "0.8.24"
# Avalanche C-Chain: stay on paris so no opcode newer than the deployed fork is emitted.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./abi" }]

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 64

# CI keeps the run time bounded; the 10k-run gate is `forge test --fuzz-runs 10000` (L5).
[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
