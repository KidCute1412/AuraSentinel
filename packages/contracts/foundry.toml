[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
script = "script"
solc_version = "0.8.24"
# Avalanche C-Chain: stay on paris so no opcode newer than the deployed fork is emitted.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./abi" }, { access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 10000

# 256 sequences x 64 calls per invariant. Reverts are valid outcomes (the handler wraps every call in try/catch).
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Quick local loop only. CI and proof/tests.json always use 10,000 runs (script/export-proof.mjs).
[profile.quick.fuzz]
runs = 1000

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
local = "http://127.0.0.1:8545"

# Snowtrace verification goes through Routescan's Etherscan-compatible API; testnet needs no real key.
[etherscan]
fuji = { key = "verifyContract", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
