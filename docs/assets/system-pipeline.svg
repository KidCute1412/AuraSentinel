      <rect x="890" y="227" width="18" height="18" fill="#ffd23f"/><text x="899" y="240">6</text>
      <rect x="732" y="579" width="18" height="18" fill="#ffd23f"/><text x="741" y="592">6</text>
      <rect x="88" y="973" width="18" height="18" fill="#ffd23f"/><text x="97" y="986">7</text>
    </g>

    <!-- ============ legend ============ -->
    <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#a39b87">
      <line x1="40" y1="1240" x2="72" y2="1240" stroke="#e6dec9" stroke-width="2"/>
