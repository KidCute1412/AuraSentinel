        <line x1="880" y1="276" x2="880" y2="194"/>
        <line x1="845" y1="332" x2="845" y2="374"/>
        <line x1="415" y1="332" x2="415" y2="374"/>
        <line x1="585" y1="332" x2="585" y2="374"/>
        <line x1="500" y1="426" x2="500" y2="494"/>
