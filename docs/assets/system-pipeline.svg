<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1270" width="1000" height="1270" role="img" aria-labelledby="t d">
  <title id="t">AgentShield: một lệnh đi qua hệ thống thế nào</title>
  <desc id="d">Rebalancer hoặc Red-team tạo lệnh swap vào hàng đợi. Shield 1 ngoài chain kiểm tra theo 4 bước: precheck, chạy thử trên Anvil fork, invariants, verdict. Lệnh fail bị REJECTED, không gửi tx. Lệnh an toàn được TxSender ký bằng session key và gửi lên AgentPolicyModule trên Avalanche Fuji (Shield 2), nơi 5 gate chặn mọi lệnh sai luật (REVERTED); lệnh hợp lệ được Safe thực thi và swap qua Trader Joe, tiền luôn về két. Explainer viết giải thích song song. Indexer đọc event on-chain và đẩy lên web qua SSE. Chủ két ký setPolicy và Kill-Switch trực tiếp từ ví, không qua backend. Đòn tấn công số 4 bỏ qua Shield 1 nhưng vẫn bị Shield 2 chặn.</desc>

  <defs>
    <marker id="ah-cream" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6dec9"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ee59d"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6212f"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1000" height="1270" fill="#17140f"/>

  <g font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- title -->
    <text x="40" y="48" font-size="26" font-weight="800" fill="#f4efe3">AgentShield · một lệnh đi qua hệ thống thế nào</text>
    <text x="40" y="76" font-size="14" fill="#a39b87" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">AI chỉ đề xuất → Shield 1 kiểm ngoài chain → Shield 2 chặn trên chain → két chỉ được swap</text>

    <!-- ============ lanes ============ -->
    <rect x="30" y="96" width="940" height="118" fill="#1a2b3c" stroke="#3a342a" stroke-width="1.5"/>
    <rect x="30" y="236" width="940" height="662" fill="#201c16" stroke="#3a342a" stroke-width="1.5"/>
    <rect x="30" y="920" width="940" height="290" fill="#3a2f14" stroke="#3a342a" stroke-width="1.5"/>

    <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#a39b87">
      <text x="380" y="117">TRÌNH DUYỆT</text>
      <text x="96" y="259">BACKEND · NestJS (api + worker)</text>
      <text x="96" y="943">AVALANCHE FUJI · SHIELD 2 (on-chain)</text>
    </g>

    <!-- ============ shadows (hard, cream) ============ -->
    <g fill="#e6dec9">
      <rect x="60" y="132" width="300" height="66"/>
      <rect x="604" y="132" width="340" height="66"/>
      <rect x="344" y="280" width="150" height="56"/>
      <rect x="514" y="280" width="150" height="56"/>
      <rect x="704" y="280" width="240" height="56"/>
      <rect x="344" y="378" width="320" height="52"/>
      <rect x="754" y="378" width="190" height="52"/>
      <rect x="346" y="466" width="320" height="318"/>
      <rect x="104" y="694" width="180" height="90"/>
      <rect x="344" y="818" width="320" height="56"/>
      <rect x="704" y="818" width="240" height="56"/>
      <rect x="346" y="962" width="320" height="82"/>
      <rect x="344" y="1114" width="280" height="60"/>
      <rect x="704" y="1114" width="240" height="60"/>
    </g>

    <!-- ============ browser lane ============ -->
    <rect x="56" y="128" width="300" height="66" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
    <text x="206" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#f4efe3">Ví chủ két</text>
    <text x="206" y="180" text-anchor="middle" font-size="13" fill="#cfc8b6" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">Core · MetaMask · khoá chính</text>

    <rect x="600" y="128" width="340" height="66" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
    <text x="770" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#f4efe3">Web dashboard</text>
    <text x="770" y="180" text-anchor="middle" font-size="13" fill="#cfc8b6" font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace">React · wagmi · trang /demo</text>

    <!-- ============ backend lane ============ -->
    <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#cfc8b6" text-anchor="middle">
      <!-- row 1 -->
      <rect x="340" y="276" width="150" height="56" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
      <text x="415" y="300" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Rebalancer</text>
      <text x="415" y="321">15s · toán</text>

      <rect x="510" y="276" width="150" height="56" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
      <text x="585" y="300" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Red-team</text>
      <text x="585" y="321">4 đòn tấn công</text>

      <rect x="700" y="276" width="240" height="56" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
      <text x="820" y="300" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">API</text>
