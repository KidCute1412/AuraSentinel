      <line x1="170" y1="1240" x2="202" y2="1240" stroke="#2ee59d" stroke-width="2.5"/>
      <text x="210" y="1244">lệnh an toàn</text>
      <line x1="340" y1="1240" x2="372" y2="1240" stroke="#e6212f" stroke-width="2"/>
      <text x="380" y="1244">bị chặn</text>
      <line x1="470" y1="1240" x2="502" y2="1240" stroke="#e6212f" stroke-width="2" stroke-dasharray="7 5"/>
