        <line x1="340" y1="596" x2="280" y2="596"/>
        <polyline points="380,1038 380,1092 280,1092"/>
        <polyline points="660,304 680,304 680,968 660,968" stroke-dasharray="7 5"/>
      </g>
    </g>

    <!-- ============ arrow labels ============ -->
