      <text x="480" y="1135" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Safe · két</text>
      <text x="480" y="1156">giữ USDC + WAVAX</text>

      <rect x="700" y="1110" width="240" height="60" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
      <text x="820" y="1135" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Trader Joe</text>
      <text x="820" y="1156">router · đổi USDC ⇄ WAVAX</text>
    </g>

    <!-- ============ arrows ============ -->
    <g fill="none" stroke-width="2">
      <!-- cream: data flow -->
