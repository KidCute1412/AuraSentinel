      <text x="356" y="483" text-anchor="start" font-size="13" font-weight="700" letter-spacing="1.2" fill="#f4efe3">SHIELD 1</text>
      <text x="644" y="483" text-anchor="end" font-size="12.5" letter-spacing="1.2" fill="#cfc8b6">NGOÀI CHAIN</text>

      <rect x="360" y="494" width="280" height="50" fill="#2a251d" stroke="#5a5242" stroke-width="1.2"/>
      <text x="500" y="515" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">(a) Precheck</text>
      <text x="500" y="534">soi lại 5 gate + người nhận</text>

      <rect x="360" y="566" width="280" height="50" fill="#2a251d" stroke="#5a5242" stroke-width="1.2"/>
      <text x="500" y="587" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">(b) Chạy thử</text>
      <text x="500" y="606">trên Anvil fork = bản sao Fuji</text>

      <rect x="360" y="638" width="280" height="50" fill="#2a251d" stroke="#5a5242" stroke-width="1.2"/>
      <text x="500" y="659" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">(c) Invariants</text>
      <text x="500" y="678">tiền chỉ đổi loại, không rời két</text>

      <rect x="360" y="710" width="280" height="50" fill="#2a251d" stroke="#5a5242" stroke-width="1.2"/>
      <text x="500" y="731" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Verdict</text>
