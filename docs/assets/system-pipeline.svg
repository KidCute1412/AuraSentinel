      <rect x="100" y="690" width="180" height="90" fill="#2a251d" stroke="#5a5242" stroke-width="1.5"/>
      <text x="190" y="713" font-family="Hanken Grotesk, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4efe3">Explainer</text>
      <text x="190" y="733">chạy song song</text>
