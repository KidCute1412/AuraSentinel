      <line x1="610" y1="1240" x2="642" y2="1240" stroke="#e6dec9" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="650" y="1244">song song</text>
      <rect x="836" y="1231" width="36" height="18" fill="#ffd23f"/>
