      <text x="112" y="986" fill="#f4efe3">setPolicy · <tspan fill="#ff6b6b">Kill-Switch</tspan></text>
      <text x="205" y="1016" text-anchor="middle" font-size="12.5">ký thẳng từ ví, không qua backend</text>
    </g>

    <!-- ============ step badges (highlight = "badge đếm") ============ -->
