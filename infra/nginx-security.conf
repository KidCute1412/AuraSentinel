# Included in every location that sets its own add_header (nginx drops inherited add_header there).
# The UI holds the Kill-Switch, so it must never be framed (clickjacking). No CSP yet: wallet
# connectors load their own scripts; revisit with L7/L9.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
