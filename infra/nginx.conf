server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # REST + SSE. Buffering off so job.updated / chain.* events reach the browser immediately.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    # Overwrite, never append: a client-supplied X-Forwarded-For would let anyone pick their IP
    # and dodge the per-IP write limit (A9). nginx is the only proxy, so $remote_addr is the client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security.conf;
    try_files $uri =404;
  }

  # SPA routes (/demo, /vaults/:safe, /proof...) fall back to index.html, never cached.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security.conf;
    try_files $uri /index.html;
  }
}
