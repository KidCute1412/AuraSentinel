name: deploy
# After `ci` passes on main, roll the server on the Hetzner VM to that exact commit.
# Secrets: DEPLOY_HOST (VM IPv4), DEPLOY_SSH_KEY (private key of the `deploy` user, see infra/setup-vm.sh).
# infra/.env.prod lives only on the VM; this workflow never sees the agent key.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of interrupting a build.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy deploy@"$HOST" bash -s -- "$SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/aurasentinel
          test -f infra/.env.prod || { echo "infra/.env.prod missing on the VM"; exit 1; }
          git fetch --depth 1 origin "$1"
          git reset --hard FETCH_HEAD
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build --wait --remove-orphans
          docker image prune -f >/dev/null
          curl -fsS http://127.0.0.1:8080/api/health
          REMOTE
