name: ci
on:
  # Branches are covered by pull_request (no double run on a branch with an open PR).
  # push to main runs after each merge so every merge gets a full result.
  push:
    branches: [main]
  # Tests the PR merge result against its base (this is the run that gates merging).
  pull_request:
  workflow_dispatch:
  # Lets a future cd.yml reuse this exact pipeline: `uses: ./.github/workflows/ci.yml`.
  workflow_call:

# A newer push to the same branch/PR cancels the older run. Runs on main are never cancelled,
# so every merge gets a full result (and a future CD can rely on it).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # Static guards for invariants P2/P4/P5 + secrets
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - run: bash scripts/check-invariants.sh
      - run: node scripts/sync-skills.mjs --check
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Typecheck + lint + unit tests for every JS workspace
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentshield_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # shared: regenerated ABIs/schemas must match what is committed.
      # Runs only once `gen` exists (it needs `forge build` output, so contracts must exist too).
      - name: shared codegen script present?
        id: gen
        run: |
          if node -e "process.exit(require('./packages/shared/package.json').scripts?.gen ? 0 : 1)"              && [ -f packages/contracts/foundry.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.gen.outputs.present == 'true'
      - name: shared codegen is up to date
        if: steps.gen.outputs.present == 'true'
        run: |
          (cd packages/contracts && forge build)
          pnpm --filter @agentshield/shared gen
          git diff --exit-code -- packages/shared
      # One turbo invocation: shared is built once and reused by every task.
      - run: pnpm turbo run lint typecheck test build

  # Solidity: skipped until packages/contracts exists
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: has
        working-directory: .
        run: echo "present=$([ -f packages/contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.has.outputs.present == 'true'
      - if: steps.has.outputs.present == 'true'
        run: forge fmt --check
      - if: steps.has.outputs.present == 'true'
        run: forge build --sizes
      - if: steps.has.outputs.present == 'true'
        run: forge test -vvv --fuzz-runs 1000
        env:
          FOUNDRY_PROFILE: ci
      # Blocks on high-severity findings; triage medium/low in review.
      - name: Slither
        if: steps.has.outputs.present == 'true'
        uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts
          fail-on: high

  # Server <-> chain flow on an Anvil fork of Fuji (the "demo must never fail" guard).
  # Skipped until contracts and a `test:integration` script in apps/server exist.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentshield_test
      RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: has
        run: |
          if [ -f packages/contracts/foundry.toml ] &&              node -e "process.exit(require('./apps/server/package.json').scripts?.['test:integration'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.has.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.has.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.has.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Start Anvil fork of Fuji
        if: steps.has.outputs.present == 'true'
        run: |
          anvil --fork-url https://api.avax-test.network/ext/bc/C/rpc --chain-id 43113 --port 8545 > anvil.log 2>&1 &
          for i in $(seq 1 30); do cast block-number --rpc-url "$RPC_URL" && exit 0; sleep 2; done
          cat anvil.log; exit 1
      - if: steps.has.outputs.present == 'true'
        run: pnpm turbo run build --filter=server...
      - if: steps.has.outputs.present == 'true'
        run: pnpm --filter server test:integration

  # Demo runs from compose, so the images must keep building.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build infra compose (anvil image)
        run: docker compose -f infra/docker-compose.yml build
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc
      - name: Build prod compose (once it exists)
        run: |
          if [ -f infra/docker-compose.prod.yml ]; then
            docker compose -f infra/docker-compose.prod.yml build
          else
            echo "infra/docker-compose.prod.yml not present yet, skipping"
          fi
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc

  # Single required check for branch protection: "ci-pass"
  ci-pass:
    if: always()
    needs: [invariants, node, contracts, integration, docker]
    runs-on: ubuntu-latest
    steps:
      # Fail on anything except success; steps inside jobs already skip themselves when not applicable.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
