name: ci
on:
  # Branches are covered by pull_request (no double run on a branch with an open PR).
  # push to main runs after each merge so every merge gets a full result.
  push:
    branches: [main]
  # Tests the PR merge result against its base (this is the run that gates merging).
  pull_request:
  workflow_dispatch:
  # Lets a future cd.yml reuse this exact pipeline: `uses: ./.github/workflows/ci.yml`.
  workflow_call:

# A newer push to the same branch/PR cancels the older run. Runs on main are never cancelled,
# so every merge gets a full result (and a future CD can rely on it).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # Static guards for invariants P2/P4/P5 + secrets
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - run: bash scripts/check-invariants.sh
      - run: node scripts/sync-skills.mjs --check
      - name: Watchdog alert logic
        run: node --test infra/watchdog/watchdog.test.mjs
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Typecheck + lint + unit tests for every JS workspace
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentshield_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # shared: generated ABIs must match packages/contracts/abi (D5). Reads the committed JSON only, so no
      # forge here; the contracts job checks that abi/ itself matches the Solidity.
      - name: shared codegen is up to date
        run: |
          pnpm --filter @agentshield/shared gen
          git diff --exit-code -- packages/shared
      # One turbo invocation: shared is built once and reused by every task.
      - run: pnpm turbo run lint typecheck test build

  # Solidity: skipped until packages/contracts exists
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: has
        working-directory: .
        run: echo "present=$([ -f packages/contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.has.outputs.present == 'true'
      - if: steps.has.outputs.present == 'true'
        run: forge fmt --check
      - if: steps.has.outputs.present == 'true'
        run: forge build --sizes
      # D5: committed ABIs must be exactly what the Solidity compiles to.
      - name: ABIs in abi/ are up to date
        if: steps.has.outputs.present == 'true'
        run: |
          node script/export-abi.mjs
          git diff --exit-code -- abi
      - if: steps.has.outputs.present == 'true'
        run: forge test -vvv --fuzz-runs 1000
        env:
          FOUNDRY_PROFILE: ci
      # Blocks on high-severity findings; triage medium/low in review.
      - name: Slither
        if: steps.has.outputs.present == 'true'
        uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts
          fail-on: high

  # Server <-> chain flow on an Anvil fork of Fuji (the "demo must never fail" guard).
  # Skipped until contracts and a `test:integration` script in apps/server exist.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentshield_test
      RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: has
        run: |
          if [ -f packages/contracts/foundry.toml ] &&              node -e "process.exit(require('./apps/server/package.json').scripts?.['test:integration'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.has.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.has.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.has.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # Three nodes: 8545 = "Fuji" (fork, real contracts deployed below), 8546 = the simulator's
      # fork of 8545 (the server resets it), 18545 = a plain node for the mock-module spec.
      - name: Start Anvil nodes
        if: steps.has.outputs.present == 'true'
        run: |
          anvil --fork-url https://api.avax-test.network/ext/bc/C/rpc --chain-id 43113 --port 8545 > anvil.log 2>&1 &
          for i in $(seq 1 30); do cast block-number --rpc-url "$RPC_URL" && break; sleep 2; done
          cast block-number --rpc-url "$RPC_URL" || { cat anvil.log; exit 1; }
          anvil --fork-url "$RPC_URL" --chain-id 43113 --port 8546 > anvil-sim.log 2>&1 &
          anvil --chain-id 43113 --port 18545 > anvil-plain.log 2>&1 &
          for p in 8546 18545; do
            for i in $(seq 1 30); do cast block-number --rpc-url "http://127.0.0.1:$p" && break; sleep 1; done
          done
      # Same L4 scripts and Anvil dev keys as deploy-dry-run: #0 owner, #1 agent.
      - name: Deploy contracts with the L4 scripts
        if: steps.has.outputs.present == 'true'
        working-directory: packages/contracts
        env:
          DEPLOYMENT: fork
          OWNER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          AGENT_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
        run: |
          forge script script/Deploy.s.sol --rpc-url "$RPC_URL" --private-key "$OWNER_KEY" --broadcast
          forge script script/SetupPool.s.sol --rpc-url "$RPC_URL" --private-key "$OWNER_KEY" --broadcast
          VAULT=public forge script script/CreateVault.s.sol --rpc-url "$RPC_URL" --private-key "$OWNER_KEY" --broadcast
          cat deployments/fork.json
      - if: steps.has.outputs.present == 'true'
        run: pnpm turbo run build --filter=server...
      # e2e boots the compiled server (dist/) against the deployed contracts; see test/e2e/pipeline.e2e.spec.ts.
      - name: Integration + e2e
        if: steps.has.outputs.present == 'true'
        run: pnpm --filter server test:integration
        env:
          E2E_DEPLOYMENT: ${{ github.workspace }}/packages/contracts/deployments/fork.json
          E2E_CHAIN_URL: http://127.0.0.1:8545
          E2E_SIM_URL: http://127.0.0.1:8546
          ANVIL_TEST_URL: http://127.0.0.1:18545
      - name: Anvil logs on failure
        if: failure() && steps.has.outputs.present == 'true'
        run: tail -n 50 anvil.log anvil-sim.log anvil-plain.log

  # Demo runs from compose, so the images must keep building.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build infra compose (anvil image)
        run: docker compose -f infra/docker-compose.yml build
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc
      - name: Build prod compose
        run: docker compose -f infra/docker-compose.prod.yml build
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc
          FUJI_RPC_URLS: https://api.avax-test.network/ext/bc/C/rpc
          POSTGRES_PASSWORD: ci-only
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      # Smoke: migrations apply, the API answers health, nginx serves the SPA and proxies /api.
      # Only api + web: the worker refuses to start in production without a session key (by design).
      - name: Smoke prod compose (api + web)
        run: |
          docker compose -f infra/docker-compose.prod.yml up -d --wait api web
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/demo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/jobs/00000000-0000-4000-8000-000000000000)" = 404
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc
          FUJI_RPC_URLS: https://api.avax-test.network/ext/bc/C/rpc
          POSTGRES_PASSWORD: ci-only
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml logs --no-color --tail 100
        env:
          FORK_URL: https://api.avax-test.network/ext/bc/C/rpc
          FUJI_RPC_URLS: https://api.avax-test.network/ext/bc/C/rpc
          POSTGRES_PASSWORD: ci-only
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef

  # L4: the exact Fuji deploy sequence (scripts in packages/contracts/script) on an Anvil fork of Fuji, so the real
  # deploy only runs scripts that already worked against the real Trader Joe router and Safe v1.4.1 contracts.
  # Keys are Anvil's public dev accounts #0 (deployer/owner) and #1 (agent); see .gitleaks.toml.
  deploy-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    env:
      DEPLOYMENT: fork
      RPC: http://127.0.0.1:8545
      OWNER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      AGENT_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      AGENT_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start Anvil fork of Fuji
        run: |
          anvil --fork-url https://api.avax-test.network/ext/bc/C/rpc --chain-id 43113 --port 8545 > anvil.log 2>&1 &
          for i in $(seq 1 30); do cast block-number --rpc-url "$RPC" && exit 0; sleep 2; done
          cat anvil.log; exit 1
      - name: 1. Deploy MockUSDC, MockWAVAX, factory
        run: forge script script/Deploy.s.sol --rpc-url "$RPC" --private-key "$OWNER_KEY" --broadcast
      - name: 2. Trader Joe pool
        run: forge script script/SetupPool.s.sol --rpc-url "$RPC" --private-key "$OWNER_KEY" --broadcast
      - name: 3. Public and stage vaults
        run: |
          VAULT=public forge script script/CreateVault.s.sol --rpc-url "$RPC" --private-key "$OWNER_KEY" --broadcast
          VAULT=stage forge script script/CreateVault.s.sol --rpc-url "$RPC" --private-key "$OWNER_KEY" --broadcast
      - name: 4. Guarded swap signed by the agent (both vaults)
        run: |
          VAULT=public forge script script/ManualSwap.s.sol --rpc-url "$RPC" --private-key "$AGENT_KEY" --broadcast
          VAULT=stage forge script script/ManualSwap.s.sol --rpc-url "$RPC" --private-key "$AGENT_KEY" --broadcast
      - name: 5. Over-cap swap is mined and reverts with ExceedsPerTxCap (attack #2)
        run: |
          MODULE=$(jq -r .publicModule deployments/fork.json)
          USDC=$(jq -r .usdc deployments/fork.json)
          WAVAX=$(jq -r .wavax deployments/fork.json)
          DEADLINE=$(( $(cast block --rpc-url "$RPC" -f timestamp) + 300 ))
          OUT=$(cast send "$MODULE" "executeGuardedSwap(address,address,uint256,uint256,uint256)" \
            "$USDC" "$WAVAX" 2000000000 1 "$DEADLINE" --gas-limit 300000 \
            --rpc-url "$RPC" --private-key "$AGENT_KEY" --json || true)
          echo "$OUT"
          test "$(echo "$OUT" | jq -r .status)" = "0x0"
          # Same call as eth_call: the revert data must start with the ExceedsPerTxCap selector.
          SEL=$(cast sig "ExceedsPerTxCap()")
          ERR=$(cast call "$MODULE" "executeGuardedSwap(address,address,uint256,uint256,uint256)" \
            "$USDC" "$WAVAX" 2000000000 1 "$DEADLINE" --from "$AGENT_ADDRESS" --rpc-url "$RPC" 2>&1 || true)
          echo "$ERR"
          echo "$ERR" | grep -qi "${SEL#0x}"
      - run: cat deployments/fork.json
        if: always()

  # Single required check for branch protection: "ci-pass"
  ci-pass:
    if: always()
    needs: [invariants, node, contracts, integration, docker, deploy-dry-run]
    runs-on: ubuntu-latest
    steps:
      # Fail on anything except success; steps inside jobs already skip themselves when not applicable.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
