name: skills-sync
on:
  pull_request:
    paths: [".agents/skills/**", ".claude/skills/**", "scripts/sync-skills.mjs"]
  push:
    branches: [main]
    paths: [".agents/skills/**", ".claude/skills/**", "scripts/sync-skills.mjs"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs --check
