name: skills-sync
on:
  # No path filter: a skipped check is indistinguishable from "did not run". The job takes seconds.
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs --check
